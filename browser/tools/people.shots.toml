# The people gallery: browser.exe --gallery people.shots.toml --shots DIR
# Run it twice for a before and an after: with PEGASUS_NO_PEOPLE=1 the wooden mannequins stand in the people's places.
# (the people are persons of humanbody's cast: 0 the main avatar in his black cape, 1 tall slim man, 2 stocky older man, 3 average man,
# 4 petite woman, 5 tall athletic woman, 6 average woman; 7 and 8 the labyrinth's guards in their kit)

