# pegasus3d gallery shots: browser.exe --gallery gallery.shots.toml  (PNGs land beside this file, or in --shots DIR)
# Coordinates are the island's world metres, x east, y up, z south. The cottage's front wall stands at (-16, 330) facing +z (the
# beach and its path are at z 500), the brook's bridge at (-7, 314.4), the mirror in the cottage's back (north) wall at
# (-14.5, 324). pos-agl / target-agl give y as metres above the ground at that x, z; pos / target give the world's y.

[defaults]
size = 2560x1440
fov = 55
settle = 150
weather = fair

[cottage-dusk]
# From the lawn's west side, the pines at left, an autumn maple at right, the moon rising, lanterns lit along the path
pos-agl = -25, 1.5, 352
target-agl = -14, 4.5, 330
time = 17.7

[cottage-night]
pos-agl = -25, 1.5, 352
target-agl = -14, 4.5, 330
time = 23

[cottage-rain]
pos-agl = -9, 1.6, 350
target-agl = -16, 4, 330
time = 14
weather = rain

[island-from-above]
# The whole island from the sea off its south-west, at 4K
pos = -450, 600, 1300
target-agl = 0, 0, 250
time = 15
size = 3840x2160

[brook-bridge]
pos-agl = -12, 1.7, 319.4
target-agl = -7, 0.6, 314.4
time = 16.3
fov = 50

[shore-sunset]
pos-agl = -60, 1.3, 495
target-agl = -200, 2, 560
time = 17.25
fov = 50

[mirror]
# The mirror in the cottage's back wall, a little before dusk
pos-agl = -11, 1.6, 316.5
target-agl = -14.5, 1.5, 324
time = 16.5
fov = 45

[labyrinth-antechamber]
# 300 m under the island: the floor is y = -300
pos = 0, -298.3, 322.2
target = 0, -297.8, 340
fov = 69
