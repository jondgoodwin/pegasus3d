# Added to /etc/nginx/conf.d/cone.conf: the zone at the top (next to playrun), the location inside the cone.jondgoodwin.com
# server block, before "location /play/". An exact match, so it cannot collide with the playground's /play/ routes.
limit_req_zone $binary_remote_addr zone=playreq:10m rate=6r/m;

    location = /play/request {
        limit_except POST { deny all; }
        limit_req zone=playreq burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8098/request;
        proxy_http_version 1.0;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
