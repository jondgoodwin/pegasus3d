[package]
name = "guidebrowser"
version = "0.1.0"
output = "executable"


# The web panel's shim over the Chromium Embedded Framework (cef/src/cefshim.cc, built by cef/build-shim.ps1 into
# cef/bin). CEF's own runtime files (libcef.dll, its .pak files, locales) and cefhelper.exe are copied beside the
# program by the build script (studio-work\build-web.ps1).
[link]
libraries = ["cefshim"]
paths = ["cef/bin"]
runtime = ["cefshim"]
