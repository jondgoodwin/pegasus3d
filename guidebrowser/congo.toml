[package]
name = "guidebrowser"
version = "0.1.0"
output = "executable"


# The web panel's shim over the Chromium Embedded Framework (cef/src/cefshim.cc, built by cef/build-shim.ps1 into
# cef/bin); CEF's own runtime files and cefhelper.exe are copied beside the program by the build script.
# deskshim.dll (shim\deskshim.c, built by shim\build-shim.ps1 into shim\out): the desk panel's screen capture and pointer.
[link]
libraries = ["cefshim", "deskshim"]
paths = ["cef/bin", "shim/out"]
runtime = ["cefshim", "deskshim"]
